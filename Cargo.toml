[package]
name = "wftpg"
version = "2.3.18"
edition = "2021"
authors = ["WFTPG Developer"]
description = "SFTP+FTP GUI Management Tool for ARM Linux (纯 Rust + GTK3 实现)"

[dependencies]
gtk = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.0"
argon2 = "0.5"
rand = "0.9.2"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
systemd-journal-logger = "2"
anyhow = "1"
thiserror = "2"
ipnet = "2"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
rsa = { version = "0.9", features = ["pem"] }
pkcs8 = { version = "0.10", features = ["pem"] }
russh = "0.57.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "io-util", "fs", "signal" ] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
async-trait = "0.1"
bytes = "1"
fs2 = "0.4"
libc = "0.2"
ctrlc = "3"
socket2 = "0.6"
nix = { version = "0.31", features = ["user"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package."*"]
opt-level = 3

[[bin]]
name = "wftp-gui"
path = "src/bin/wftp-gui.rs"

[[bin]]
name = "wftpd"
path = "src/bin/wftpd.rs"

[[bin]]
name = "wftpg-dbus"
path = "src/bin/wftpg-dbus.rs"
