[package]
name = "wftpg"
version = "1.0.0"
edition = "2021"
authors = ["WFTPG Developer"]
description = "SFTP+FTP GUI Management Tool for ARM Linux"

[lib]
name = "wftpg"
path = "src/lib.rs"

[[bin]]
name = "wftpg"
path = "src/main.rs"

[[bin]]
name = "wftpg-service"
path = "src/service_main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
argon2 = "0.5"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "1"
dirs = "5"
ipnet = "2"
regex = "1"
ctrlc = "3"

[profile.release]
opt-level = 3
lto = true
