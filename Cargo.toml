[package]
name = "wftpg"
version = "2.0.0"
edition = "2021"
authors = ["WFTPG Developer"]
description = "SFTP+FTP GUI Management Tool for ARM Linux (纯Rust + GTK3实现)"

[dependencies]
gtk = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.0"
argon2 = "0.5"
rand = "0.9"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "2"
dirs = "6"
ipnet = "2"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
rsa = { version = "0.9", features = ["pem"] }
pkcs8 = { version = "0.10", features = ["pem"] }
russh = "0.57.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "io-util", "fs" ] }
async-trait = "0.1"
bytes = "1"
fs2 = "0.4"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
