# WFTPD 配置模板
#
# 用户态运行模型：wftpd 以当前桌面用户运行（systemd --user 服务），
# 所有路径遵循 XDG 规范，可直接放入 ~/.config/wftpd/config.toml。
# 路径中的 ~ 由部署时的实际用户主目录替换。

[ftp]
enabled = true
bind_ip = "0.0.0.0"
port = 2121
passive_ports = [50000, 51000]
welcome_message = "Welcome to WFTPD FTP Server"
allow_anonymous = false
max_speed_kbps = 0
encoding = "UTF-8"
data_timeout = 300

[sftp]
enabled = true
bind_ip = "0.0.0.0"
port = 2222
# 首次启动若密钥不存在会自动生成 Ed25519 密钥对
host_key_path = "~/.local/state/wftpd/ssh/ssh_host_ed25519_key"
max_auth_attempts = 3
auth_timeout = 60
log_level = "info"

[security]
allowed_ips = ["0.0.0.0/0"]
denied_ips = []
max_login_attempts = 5
ban_duration = 300
require_ssl = false
max_connections = 100
connection_timeout = 300
idle_timeout = 600

[logging]
log_dir = "~/.local/state/wftpd/logs"
log_level = "info"
max_log_size = 10485760
max_log_files = 10
enable_json = false
# 允许后端通过 WatchLogs 向前端实时推送日志
enable_gui_logging = true
