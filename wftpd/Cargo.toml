[package]
name = "wftpd"
version = "2.7.3"
edition = "2024"
authors = ["WFTPG Developer"]
description = "WFTPG Backend Server - FTP/SFTP Service Manager"

[dependencies]
# Serialization & Deserialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.0"

# Async Runtime
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "io-util", "fs", "signal" ] }
async-trait = "0.1"
bytes = "1"

# SFTP/SSH Protocol
russh = "0.59.0"

# TLS/SSL
tokio-rustls = "0.26.4"
rustls = "0.23.37"

# Cryptography & Security
argon2 = "0.5"
rsa = { version = "0.9", features = ["pem"] }
pkcs8 = { version = "0.10", features = ["pem"] }
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
pem = "3.0"
rand = "0.9.2"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "local-time", "chrono"] }
tracing-appender = "0.2"

# Error Handling
anyhow = "1"
thiserror = "2"

# Date & Time
chrono = { version = "0.4", features = ["serde"] }

# Network & IP
ipnet = "2"
socket2 = "0.6"

# System & OS Integration
libc = "0.2"
nix = { version = "0.31", features = ["user", "fs", "socket"] }
fs2 = "0.4"
ctrlc = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package."*"]
opt-level = 3

[[bin]]
name = "wftpd"
path = "src/bin/wftpd.rs"