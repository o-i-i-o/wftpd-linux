[package]
name = "wftpg"
version = "2.7.3"
edition = "2024"
authors = ["WFTPG Developer"]
description = "SFTP+FTP GUI Management Tool for ARM Linux (纯 Rust + GTK3 实现)"

[dependencies]
# GUI Framework
gtk = "0.18"

# Serialization & Deserialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.0"

# Async Runtime
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "io-util", "fs", "signal"] }
async-trait = "0.1"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "local-time", "chrono"] }
tracing-appender = "0.2"

# Error Handling
anyhow = "1"
thiserror = "2"

# Date & Time
chrono = { version = "0.4", features = ["serde"] }

# Network & IP
ipnet = "2"

# System & OS Integration
libc = "0.2"

# Cryptography & Security
argon2 = "0.5"
rand = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package."*"]
opt-level = 3

[[bin]]
name = "wftp-gui"
path = "src/bin/wftp-gui.rs"
